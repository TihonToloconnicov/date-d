<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Пойдёшь со мной на свидание?</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Marck+Script&family=Nunito:wght@600;800&display=swap" rel="stylesheet">
<style>
:root{
  --bg1:#ffd9e6; --bg2:#e9d8ff; --card:#fffafc; --ink:#6b2346; --soft:#a14a76;
  --yes:#ff5c93; --yes2:#ff8fb3; --no:#f3e3ec; --noink:#8a4a69;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){--bg1:#3a1530;--bg2:#2a1a4a;--card:#4a2140;--ink:#ffe3ef;--soft:#f3b6d2;--no:#5d3153;--noink:#ffd6e8}
}
*{box-sizing:border-box}
html,body{height:100%;margin:0}
body{
  font-family:"Nunito",system-ui,sans-serif; color:var(--ink);
  background:
    radial-gradient(circle at 20% 15%,rgba(255,255,255,.55) 0 8%,transparent 9%),
    radial-gradient(circle at 80% 85%,rgba(255,255,255,.45) 0 10%,transparent 11%),
    linear-gradient(135deg,var(--bg1),var(--bg2));
  background-color:var(--bg1);
  overflow:hidden; position:relative;
}
.sticker{position:fixed;font-size:clamp(28px,6vw,52px);user-select:none;pointer-events:none;animation:float 5s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-12px) rotate(6deg)}}
.stage{height:100%;display:flex;align-items:center;justify-content:center;padding:20px}
.card{
  position:relative;width:min(520px,100%);background:var(--card);border-radius:36px;
  padding:44px 28px 36px;text-align:center;
  box-shadow:0 18px 50px rgba(160,60,110,.25);
}
.page{display:none}
.page.on{display:block;animation:pop .45s cubic-bezier(.2,1.4,.4,1)}
@keyframes pop{from{transform:scale(.88);opacity:0}}
h1{font-family:"Marck Script","Segoe Script",cursive;font-weight:400;font-size:clamp(38px,9vw,58px);line-height:1.1;margin:8px 0 6px}
p.sub{color:var(--soft);font-weight:600;margin:0 0 28px;font-size:18px}
.big{font-size:84px;line-height:1}
.btns{display:flex;gap:14px;justify-content:center;align-items:center;flex-wrap:wrap;position:relative}
button{font:inherit;font-weight:800;font-size:20px;border:0;border-radius:999px;padding:15px 38px;cursor:pointer;transition:transform .15s}
button:focus-visible{outline:3px solid var(--ink);outline-offset:3px}
#yes{background:linear-gradient(135deg,var(--yes),var(--yes2));color:#fff;box-shadow:0 8px 20px rgba(255,92,147,.45)}
#yes:hover{transform:scale(1.06)}
#no{background:var(--no);color:var(--noink)}
#no.shake{animation:shake .45s}
@keyframes shake{20%{transform:translateX(-9px) rotate(-4deg)}40%{transform:translateX(9px) rotate(4deg)}60%{transform:translateX(-6px)}80%{transform:translateX(6px)}}
#bubble{
  position:absolute;left:50%;bottom:calc(100% + 14px);transform:translateX(-50%) scale(.7);
  background:var(--ink);color:var(--card);padding:10px 18px;border-radius:18px;font-weight:800;font-size:16px;
  width:max-content;max-width:min(300px,80vw);opacity:0;pointer-events:none;transition:.25s;
}
#bubble.show{opacity:1;transform:translateX(-50%) scale(1)}
.time{font-family:"Marck Script","Segoe Script",cursive;font-size:clamp(60px,16vw,96px);color:var(--yes);margin:6px 0 4px;line-height:1}
.day{font-weight:800;font-size:22px;margin:0}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

.q{font-weight:800;font-size:18px;margin:20px 0 10px}
.chips{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.chip{background:var(--no);color:var(--noink);font-size:17px;padding:10px 18px}
.chip.sel{background:linear-gradient(135deg,var(--yes),var(--yes2));color:#fff}
#done{margin-top:26px;width:100%;background:linear-gradient(135deg,var(--yes),var(--yes2));color:#fff}
#done:disabled{opacity:.45;cursor:not-allowed}
#yes{flex:1 1 auto;transition:font-size .4s,transform .15s}
#no{overflow:hidden;white-space:nowrap;max-width:200px;transition:all .4s}
.btns{flex-wrap:nowrap!important}
</style>
</head>
<body>
<span class="sticker" style="left:6%;top:10%">💖</span>
<span class="sticker" style="right:8%;top:8%;animation-delay:-1s">🌸</span>
<span class="sticker" style="left:10%;bottom:12%;animation-delay:-2s">🧸</span>
<span class="sticker" style="right:7%;bottom:10%;animation-delay:-3s">🍓</span>
<span class="sticker" style="left:44%;top:3%;animation-delay:-1.5s">✨</span>
<span class="sticker" style="right:30%;bottom:3%;animation-delay:-2.5s">💌</span>

<div class="stage"><div class="card">
  <section class="page on" id="p1">
    <div class="big">🐻💕</div>
    <h1>Пойдёшь со мной на свидание?</h1>
    <p class="sub">Только скажи «да» 🥺</p>
    <div class="btns" id="btns">
      <div id="bubble" role="status" aria-live="polite"></div>
      <button id="yes">Да 💖</button>
      <button id="no">Нет</button>
    </div>
  </section>

  <section class="page" id="p2">
    <div class="big">🎀</div>
    <h1>Ура! Осталось чуть-чуть</h1>
    <p class="q">Во сколько у тебя заканчиваются пары?</p>
    <div class="chips" id="endChips"></div>
    <p class="q">Сколько времени тебе нужно на сборыи помыть попу?</p>
    <div class="chips" id="prepChips"></div>
    <button id="done" disabled>Готово 💌</button>
  </section>

  <section class="page" id="p3">
    <div class="big">💃</div>
    <h1>Тогда ждунькаю тебя котенка в</h1>
    <div class="time" id="time"></div>
    <p class="day" id="day"></p>
    <p class="sub" style="margin:16px 0 18px">И оденься в самое красивенькое 🌷</p>
    <p class="sub" id="status" style="margin:0;font-size:16px"></p>
  </section>
</div></div>

<script>
// Вставь токен бота, свой chat_id и поменяй день:
var BOT_TOKEN = "ВСТАВЬ_ТОКЕН_БОТА";
var CHAT_ID = "ВСТАВЬ_СВОЙ_CHAT_ID";
var DAY = "понедельник";

var endTimes = ["12:00","13:00","14:00","15:00","16:00","17:00","18:00"];
var preps = [1,2,3];
var endV = null, prepV = null;
var $ = function(id){ return document.getElementById(id); };

function show(id){
  document.querySelectorAll(".page").forEach(function(p){ p.classList.remove("on"); });
  $(id).classList.add("on");
}
function chips(box, items, label, onPick){
  items.forEach(function(v){
    var b = document.createElement("button");
    b.type = "button"; b.className = "chip"; b.textContent = label(v);
    b.addEventListener("click", function(){
      box.querySelectorAll(".chip").forEach(function(c){ c.classList.remove("sel"); });
      b.classList.add("sel"); onPick(v);
      $("done").disabled = !(endV && prepV);
    });
    box.appendChild(b);
  });
}
chips($("endChips"), endTimes, function(v){ return v; }, function(v){ endV = v; });
chips($("prepChips"), preps, function(v){ return v + (v === 1 ? " час" : " часа"); }, function(v){ prepV = v; });

// Кнопка «Нет»: уменьшается при каждом нажатии, пока не исчезнет
var phrases = ["Ой, ты случайно промахнулась? 🙈","Попробуй ещё раз 🥹","Мишка грустит… из-за тебя 🧸💔","Я становлюсь меньше 😢","Почти пропала…(звуки боли) 🥺"];
var clicks = 0, timer, MAX = 5;
var no = $("no"), yes = $("yes"), bubble = $("bubble");
no.addEventListener("click", function(){
  clicks++;
  var k = Math.max(0, 1 - clicks / MAX);
  if (clicks >= MAX){
    no.style.maxWidth = "0"; no.style.padding = "0"; no.style.opacity = "0"; no.style.marginLeft = "-14px";
    no.style.pointerEvents = "none"; no.setAttribute("tabindex","-1");
    bubble.textContent = "Кнопка «Нет» умерла. Остаётся только «Да» 💖";
    yes.style.fontSize = "26px";
  } else {
    no.style.fontSize = (20 * k + 6) + "px";
    no.style.padding = (15 * k + 4) + "px " + (38 * k + 8) + "px";
    bubble.textContent = phrases[(clicks - 1) % phrases.length];
    no.classList.remove("shake"); void no.offsetWidth; no.classList.add("shake");
  }
  bubble.classList.add("show");
  clearTimeout(timer);
  timer = setTimeout(function(){ bubble.classList.remove("show"); }, 2000);
});
yes.addEventListener("click", function(){ show("p2"); });

function pad(n){ return (n < 10 ? "0" : "") + n; }
$("done").addEventListener("click", function(){
  var h = parseInt(endV, 10) + prepV;
  var t = pad(h % 24) + ":00";
  $("time").textContent = t;
  $("day").textContent = "в " + DAY;
  var body = "Она сказала ДА 💖\n\nДень: " + DAY +
    "\nПары заканчиваются: " + endV +
    "\nВремя на сборы: " + prepV + " ч." +
    "\nВстречаемся в: " + t;
  show("p3");
  var st = $("status");
  st.textContent = "Отправляю ответ… 📨";
  fetch("https://api.telegram.org/bot" + 8657991314:AAFCKuDZ11dO8QgVKNMcBEiX8wKMpGSs188 + "/sendMessage", {
    method: "POST",
    headers: {"Content-Type": "application/json"},
    body: JSON.stringify({chat_id: CHAT_ID, text: body})
  }).then(function(r){ return r.json(); }).then(function(d){
    if (d.ok){ st.textContent = "Ответ отправлен ✅"; }
    else throw new Error("tg");
  }).catch(function(){ st.textContent = "Не получилось отправить автоматически 😢"; });
});
</script>
</body>
</html>
